name: Android CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, tests and release bundle
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'kliutsuk-aliaksandr_MiniProject' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'kliutsuk-aliaksandr' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Sonar SCM blame needs the default branch ref and complete Git history.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android 36 SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate unit-test coverage report
        run: ./gradlew :app:jacocoDebugUnitTestReport --no-daemon

      - name: Run Android lint
        run: |
          set +e
          ./gradlew lintDebug --no-daemon
          lint_status=$?
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          exit $lint_status

      - name: Build unsigned release AAB and reject Kotlin metadata warnings
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew bundleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/release-minification.log"
          if grep -Eiq 'An error occurred when parsing kotlin metadata|Unexpected error during rewriting of Kotlin metadata|Failed to parse Kotlin metadata' "$RUNNER_TEMP/release-minification.log"; then
            echo "::error::R8 emitted a Kotlin metadata parsing warning. Check the R8/Kotlin compatibility override before publishing."
            exit 1
          fi
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload unit-test coverage
        uses: actions/upload-artifact@v4
        with:
          name: miniproject-unit-test-coverage
          path: app/build/reports/jacoco/debugUnitTest/
          if-no-files-found: error


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miniproject-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: miniproject-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Require SonarQube credentials for trusted builds
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required for pushes and same-repository pull requests."
            exit 1
          fi

      - name: Explain SonarQube fork-PR limitation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::SonarQube analysis is skipped for external fork pull requests because repository secrets are not exposed."

      - name: Run SonarQube analysis and enforce Quality Gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./gradlew sonar --no-daemon --stacktrace

  wrapper-windows:
    name: Verify Gradle Wrapper on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Windows wrapper
        run: .\\gradlew.bat --version

  instrumentation:
    name: UI instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniproject-instrumentation-api-${{ matrix.api-level }}-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
