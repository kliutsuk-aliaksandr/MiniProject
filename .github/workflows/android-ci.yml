name: Android CI

on:
  push:
    branches: [main, fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, tests and release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android 36 SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run Android lint
        run: |
          set +e
          gradle lintDebug --no-daemon
          lint_status=$?
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          exit $lint_status

      - name: Build unsigned release AAB
        run: gradle bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miniproject-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: miniproject-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
